        <option value="">All players</option>

      <select id="week-filter" class="chip" style="appearance:none;text-align:left;cursor:pointer">

    </div>
  </div>

  <div id="history-list"></div>
  <div id="history-empty" class="empty-state" style="display:none">No picks match that filter.</div>
</main>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/pick-utils.js"></script>
<script src="js/players.js"></script>
<script src="js/live-scores.js"></script>
<script src="js/grading.js"></script>
<script src="js/season-data.js"></script>
<script>
  (async function () {
    const playerFilter = document.getElementById("player-filter");
    const weekFilter = document.getElementById("week-filter");
    const list = document.getElementById("history-list");
    const empty = document.getElementById("history-empty");
    list.innerHTML = '<div class="empty-state">Loading history…</div>';

    await Promise.all([loadPlayers(), loadScoringConfig()]);

    let entries = [];

    // Rebuilds the filter dropdowns from the latest data on every poll, but
    // preserves whatever the visitor currently has selected — otherwise a
    // background refresh would silently reset "just Neil's picks" back to
    // "All players" out from under them.
    //
    // Filters/groups on entry.label ("NFL · Week 1", "NCAA · Week 1"), NOT
    // entry.weekKey — weekBucketKeyFromSnapshot() only encodes seasonType+
    // week number, not sport, so NFL Week 1 and NCAA Week 1 share the exact
    // same weekKey. Grouping by weekKey silently merged both sports' entries
    // into one section (real bug, caught before shipping by feeding actual
    // production data through this exact page). label is already unique per
    // sport+week, so it's both correct and simpler.
    function populateFilters() {
      const currentPlayer = playerFilter.value;
      const currentWeek = weekFilter.value;
      const players = [...new Set(entries.map((e) => e.name))].sort();
      playerFilter.innerHTML = '<option value="">All players</option>' + players.map((p) => `<option value="${p}">${titleCase(p)}</option>`).join("");
      const weeks = [...new Map(entries.map((e) => [e.label, e.label])).entries()].sort((a, b) => {
        const da = entries.find((e) => e.label === a[0])?.date || "";
        const db = entries.find((e) => e.label === b[0])?.date || "";
        return new Date(db) - new Date(da);
      });
      weekFilter.innerHTML = '<option value="">All weeks</option>' + weeks.map(([key, label]) => `<option value="${key}">${label}</option>`).join("");
      if ([...playerFilter.options].some((o) => o.value === currentPlayer)) playerFilter.value = currentPlayer;
      if ([...weekFilter.options].some((o) => o.value === currentWeek)) weekFilter.value = currentWeek;
    }

    function render() {
      const p = playerFilter.value;
      const w = weekFilter.value;
      const rows = entries.filter((e) => (!p || e.name === p) && (!w || e.label === w));

      // Grouped by week (sport+week, same label the filter dropdown already
      // uses) so results read as "here's how everyone did in Week N," with a
      // combined hit-rate/points total right at the top of each group —
      // rather than a flat, ungrouped list of individual cards.
      const groups = new Map();
      for (const e of rows) {
        if (!groups.has(e.label)) groups.set(e.label, { label: e.label, entries: [], maxDate: e.date });
        const g = groups.get(e.label);
        g.entries.push(e);
        if (new Date(e.date) > new Date(g.maxDate)) g.maxDate = e.date;
      }
      const groupList = [...groups.values()].sort((a, b) => new Date(b.maxDate) - new Date(a.maxDate));
      groupList.forEach((g) => g.entries.sort((a, b) => a.name.localeCompare(b.name)));

      // Cap render to keep this snappy on a phone — most useful case is one player or one week.
      const CAP = 60;
      let shown = 0;
      const htmlParts = [];
      for (const g of groupList) {
        if (shown >= CAP) break;
        const take = g.entries.slice(0, CAP - shown);
        shown += take.length;
        const totalHits = g.entries.reduce((s, e) => s + e.hits, 0);
        const totalPicks = g.entries.reduce((s, e) => s + e.total, 0);
        const totalPoints = g.entries.reduce((s, e) => s + e.points, 0);
        htmlParts.push(`
          <div class="section-label" style="display:flex;justify-content:space-between;align-items:center;margin-top:18px">
            <span>${g.label}</span>
            <span style="color:var(--text-dim);font-weight:700">${totalHits}/${totalPicks} hit · ${totalPoints.toFixed(1)} pts</span>
          </div>`);
        htmlParts.push(take.map(renderHistoryEntry).join(""));
      }
      list.innerHTML = htmlParts.join("");
      empty.style.display = rows.length === 0 ? "block" : "none";
      if (shown < rows.length) {
        list.innerHTML += `<div class="footer-note">Showing ${shown} of ${rows.length} — narrow the filter to see more.</div>`;
      }
    }

    // Polled every 30s (same cadence as the Games page) so a game finishing
    // while this tab is open shows up without a manual reload.
    let firstLoad = true;
    async function load() {
      const [picksRows, games] = await Promise.all([loadSeasonPicks(), loadSeasonGames()]);

      // Realistically there are always games somewhere in a ~400-day
      // window — zero almost certainly means the live-scores fetch failed
      // (network issue, ESPN hiccup), not that the season is empty. This
      // used to fail silently: everything would just show "Pending"
      // forever with no explanation.
      if (games.length === 0) {
        list.innerHTML = '<div class="empty-state">⚠️ Couldn\'t load live game data — check your connection and reload. Results won\'t show as Hit/Miss until this loads.</div>';
        empty.style.display = "none";
        return;
      }

      const graded = gradeSeasonPicks(picksRows, games);
      entries = computeHistoryEntries(graded);
      populateFilters();
      if (firstLoad) {
        firstLoad = false;
        const params = new URLSearchParams(location.search);
        if (params.get("player")) playerFilter.value = params.get("player").toUpperCase();
      }
      render();
    }

    playerFilter.addEventListener("change", render);
    weekFilter.addEventListener("change", render);
    await load();
    setInterval(load, 30000);
    // Mobile browsers/PWAs pause timers while backgrounded (locked screen,
    // app switched away from) — refresh immediately on return instead of
    // waiting for the next scheduled tick, which can be stale by minutes.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") load();
    });
  })();
</script>
</body>
</html>
