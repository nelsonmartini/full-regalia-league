<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>History — Full Regalia League</title>
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a1424" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="fr-gate-overlay" id="fr-gate-overlay">
  <div class="fr-gate-box">
    <div class="mark"><svg viewBox="0 0 24 24" width="60%" height="60%" xmlns="http://www.w3.org/2000/svg"><path d="M3 17 L5 8 L9 13 L12 5 L15 13 L19 8 L21 17 Z" fill="white"/><rect x="3" y="17" width="18" height="3" rx="1" fill="white"/><circle cx="5" cy="8" r="1.3" fill="white"/><circle cx="12" cy="5" r="1.3" fill="white"/><circle cx="19" cy="8" r="1.3" fill="white"/></svg></div>
    <h1>Full Regalia League</h1>
    <p>Private beta preview — enter the passphrase to continue.</p>
    <input type="password" id="fr-gate-input" placeholder="Passphrase" autocomplete="off" />
    <button id="fr-gate-submit" class="btn btn-primary btn-block">Enter</button>
    <div id="fr-gate-error" class="fr-gate-error"></div>
  </div>
</div>
<script src="js/gate.js"></script>

<header class="topbar">
  <div class="topbar-inner">
    <div class="wordmark"><span class="mark"><svg viewBox="0 0 24 24" width="60%" height="60%" xmlns="http://www.w3.org/2000/svg"><path d="M3 17 L5 8 L9 13 L12 5 L15 13 L19 8 L21 17 Z" fill="white"/><rect x="3" y="17" width="18" height="3" rx="1" fill="white"/><circle cx="5" cy="8" r="1.3" fill="white"/><circle cx="12" cy="5" r="1.3" fill="white"/><circle cx="19" cy="8" r="1.3" fill="white"/></svg></span> Full Regalia <span class="sub">League</span></div>
  </div>
</header>

<main class="app">
  <h1 class="page-title">Season History</h1>
  <p class="page-sub">Every pick, every week. Tap a name on Standings for a player's own page — or filter here.</p>

  <div class="card">
    <div class="card-title">Filter</div>
    <div class="chip-row" style="grid-template-columns:1fr 1fr">
      <select id="player-filter" class="chip" style="appearance:none;text-align:left;cursor:pointer">
        <option value="">All players</option>
      </select>
      <select id="week-filter" class="chip" style="appearance:none;text-align:left;cursor:pointer">
        <option value="">All weeks</option>
      </select>
    </div>
  </div>

  <div id="history-list"></div>
  <div id="history-empty" class="empty-state" style="display:none">No picks match that filter.</div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner" style="grid-template-columns:repeat(6,1fr)">
    <a class="nav-item" data-page="index.html" href="index.html"><span class="icon">🏠</span>Home</a>
    <a class="nav-item" data-page="standings.html" href="standings.html"><span class="icon">🏆</span>Standings</a>
    <a class="nav-item" data-page="picks.html" href="picks.html"><span class="icon">📝</span>Picks</a>
    <a class="nav-item" data-page="history.html" href="history.html"><span class="icon">📜</span>History</a>
    <a class="nav-item" data-page="live.html" href="live.html"><span class="icon">📡</span>Live</a>
    <a class="nav-item" data-page="betting-guide.html" href="betting-guide.html"><span class="icon">📘</span>Guide</a>
  </div>
</nav>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/pick-utils.js"></script>
<script src="js/players.js"></script>
<script src="js/live-scores.js"></script>
<script src="js/grading.js"></script>
<script src="js/season-data.js"></script>
<script>
  (async function () {
    const playerFilter = document.getElementById("player-filter");
    const weekFilter = document.getElementById("week-filter");
    const list = document.getElementById("history-list");
    const empty = document.getElementById("history-empty");
    list.innerHTML = '<div class="empty-state">Loading history…</div>';

    const [, picksRows, games] = await Promise.all([loadPlayers(), loadSeasonPicks(), loadSeasonGames()]);
    const graded = gradeSeasonPicks(picksRows, games);
    let entries = computeHistoryEntries(graded);

    const players = [...new Set(entries.map((e) => e.name))].sort();
    playerFilter.innerHTML += players.map((p) => `<option value="${p}">${titleCase(p)}</option>`).join("");
    const weeks = [...new Map(entries.map((e) => [e.weekKey, e.label])).entries()].sort((a, b) => {
      const da = entries.find((e) => e.weekKey === a[0])?.date || "";
      const db = entries.find((e) => e.weekKey === b[0])?.date || "";
      return new Date(db) - new Date(da);
    });
    weekFilter.innerHTML += weeks.map(([key, label]) => `<option value="${key}">${label}</option>`).join("");

    const params = new URLSearchParams(location.search);
    if (params.get("player")) playerFilter.value = params.get("player").toUpperCase();

    function render() {
      const p = playerFilter.value;
      const w = weekFilter.value;
      let rows = entries.filter((e) => (!p || e.name === p) && (!w || e.weekKey === w));
      rows = rows.sort((a, b) => new Date(b.date) - new Date(a.date) || a.name.localeCompare(b.name));
      // Cap render to keep this snappy on a phone — most useful case is one player or one week.
      const capped = rows.slice(0, 60);
      list.innerHTML = capped.map(renderHistoryEntry).join("");
      empty.style.display = rows.length === 0 ? "block" : "none";
      if (rows.length > capped.length) {
        list.innerHTML += `<div class="footer-note">Showing ${capped.length} of ${rows.length} — narrow the filter to see more.</div>`;
      }
    }

    playerFilter.addEventListener("change", render);
    weekFilter.addEventListener("change", render);
    render();
  })();
</script>
</body>
</html>
