<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Player — Full Regalia League</title>
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a1424" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Pacifico&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="fr-gate-overlay" id="fr-gate-overlay">
  <div class="fr-gate-box">
    <div class="mark"><svg viewBox="0 0 24 24" width="60%" height="60%" xmlns="http://www.w3.org/2000/svg"><path d="M3 17 L5 8 L9 13 L12 5 L15 13 L19 8 L21 17 Z" fill="white"/><rect x="3" y="17" width="18" height="3" rx="1" fill="white"/><circle cx="5" cy="8" r="1.3" fill="white"/><circle cx="12" cy="5" r="1.3" fill="white"/><circle cx="19" cy="8" r="1.3" fill="white"/></svg></div>
    <h1>Full Regalia League</h1>
    <p>Private league site — enter the passphrase to continue.</p>
    <input type="password" id="fr-gate-input" placeholder="Passphrase" autocomplete="off" />
    <button id="fr-gate-submit" class="btn btn-primary btn-block">Enter</button>
    <div id="fr-gate-error" class="fr-gate-error"></div>
  </div>
</div>
<script src="js/gate.js"></script>

<header class="topbar">
  <div class="topbar-inner">
    <div class="wordmark"><span class="mark"><svg viewBox="0 0 24 24" width="60%" height="60%" xmlns="http://www.w3.org/2000/svg"><path d="M3 17 L5 8 L9 13 L12 5 L15 13 L19 8 L21 17 Z" fill="white"/><rect x="3" y="17" width="18" height="3" rx="1" fill="white"/><circle cx="5" cy="8" r="1.3" fill="white"/><circle cx="12" cy="5" r="1.3" fill="white"/><circle cx="19" cy="8" r="1.3" fill="white"/></svg></span> <span class="wordmark-name">Full Regalia</span> <span class="sub">League</span></div>
  </div>
</header>

<main class="app">
  <p class="page-sub" style="margin-bottom:0"><a class="link" href="standings.html">← Back to Standings</a></p>
  <div style="display:flex;align-items:center;gap:12px;margin-top:20px">
    <span id="player-avatar"></span>
    <div>
      <h1 class="page-title" id="player-title" style="margin:0;display:inline-block">Player</h1><span id="player-streak"></span>
      <p class="page-sub" id="player-sub" style="margin:2px 0 0"></p>
    </div>
  </div>

  <div class="card" id="no-player" style="display:none">
    <div class="empty-state">No player selected. Go to <a class="link" href="standings.html">Standings</a> and tap a name.</div>
  </div>

  <div id="player-content" style="display:none">
    <div class="card">
      <div class="card-title">Season summary</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center">
        <div>
          <div style="font-size:22px;font-weight:800" id="stat-total">–</div>
          <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em">Total Pts</div>
        </div>
        <div>
          <div style="font-size:22px;font-weight:800" id="stat-avg">–</div>
          <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em">Avg / Week</div>
        </div>
        <div>
          <div style="font-size:22px;font-weight:800" id="stat-best">–</div>
          <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em">Best Week</div>
          <div style="font-size:10.5px;color:var(--text-faint);margin-top:2px" id="stat-best-label">&nbsp;</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Points by week</div>
      <div id="trend" class="week-chart"></div>
    </div>

    <div id="weeks-list"></div>
  </div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner" style="grid-template-columns:repeat(6,1fr)">
    <a class="nav-item" data-page="index.html" href="index.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></span>Home</a>
    <a class="nav-item" data-page="picks.html" href="picks.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></span>Picks</a>
    <a class="nav-item" data-page="standings.html" href="standings.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a1 1 0 0 0-1 1v1a3 3 0 0 0 3 3"/><path d="M17 5h3a1 1 0 0 1 1 1v1a3 3 0 0 1-3 3"/></svg></span>Standings</a>
    <a class="nav-item" data-page="live.html" href="live.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><line x1="12" y1="6" x2="12" y2="18"/><rect x="6" y="10" width="3" height="4" fill="currentColor" stroke="none"/><rect x="15" y="10" width="3" height="4" fill="currentColor" stroke="none"/><circle cx="19.5" cy="5" r="1.6" fill="currentColor" stroke="none"/></svg></span>Games</a>
    <a class="nav-item" data-page="history.html" href="history.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v5h5"/><path d="M12 7v5l4 2"/></svg></span>History</a>
    <a class="nav-item" data-page="analytics.html" href="analytics.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><rect x="7" y="12" width="3" height="6" fill="currentColor" stroke="none"/><rect x="12" y="8" width="3" height="10" fill="currentColor" stroke="none"/><rect x="17" y="4" width="3" height="14" fill="currentColor" stroke="none"/></svg></span>Analytics</a>
  </div>
</nav>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/pick-utils.js"></script>
<script src="js/players.js"></script>
<script src="js/live-scores.js"></script>
<script src="js/grading.js"></script>
<script src="js/season-data.js"></script>
<script>
  (async function () {
    const params = new URLSearchParams(location.search);
    const name = (params.get("name") || "").toUpperCase();

    if (!name) {
      document.getElementById("no-player").style.display = "block";
      return;
    }

    await Promise.all([loadPlayers(), loadScoringConfig()]);

    document.getElementById("player-title").textContent = titleCase(name);
    document.getElementById("player-sub").textContent = "Season history";
    document.getElementById("player-avatar").innerHTML = avatarHtml(name, 56);

    // Polled every 30s (same cadence as the Games page) so a game finishing
    // while this tab is open updates the totals/trend without a manual reload.
    async function load() {
      const [picksRows, games] = await Promise.all([loadSeasonPicks(), loadSeasonGames()]);
      const graded = gradeSeasonPicks(picksRows.filter((r) => r.player_name === name), games);
      const rows = computeHistoryEntries(graded).sort((a, b) => new Date(a.date) - new Date(b.date));

      if (rows.length === 0) {
        document.getElementById("no-player").style.display = "block";
        document.getElementById("no-player").querySelector(".empty-state").textContent =
          `No picks found for ${titleCase(name)} yet.`;
        document.getElementById("player-content").style.display = "none";
        return;
      }

      document.getElementById("no-player").style.display = "none";
      document.getElementById("player-content").style.display = "block";
      document.getElementById("player-streak").innerHTML = streakBadgeHtml(computeCurrentStreak(graded));

      // Only graded (finished) weeks count toward the averages — an in-progress
      // week sitting at 0 pts because games haven't finished yet would otherwise
      // drag the average down misleadingly.
      const graded_ = rows.filter((r) => r.graded);
      const total = graded_.reduce((s, r) => s + r.points, 0);
      const avg = graded_.length ? total / graded_.length : 0;
      const best = graded_.reduce((m, r) => (r.points > m.points ? r : m), graded_[0] || { points: 0, label: "–" });

      document.getElementById("stat-total").textContent = total.toFixed(1);
      document.getElementById("stat-avg").textContent = avg.toFixed(1);
      document.getElementById("stat-best").textContent = graded_.length ? best.points : "–";
      // Which week it happened, shown as its own small line rather than
      // crammed into the big number in parentheses — the label can be long
      // ("NCAA · Week 12") and was crowding a tile meant to read at a glance.
      document.getElementById("stat-best-label").textContent = graded_.length ? best.label : "";

      // Vertical bar chart, one bar per (sport, week) — a "build of the
      // season" you can scan left to right, instead of a stacked list of
      // horizontal progress bars (which read oddly once every bar's just
      // showing off against the same single number anyway).
      const maxPts = Math.max(1, ...graded_.map((r) => r.points));
      // Sport emoji + week number ("🏈 W1") instead of a bare letter+number
      // ("N1") — the letter abbreviation read as unexplained shorthand with
      // no legend anywhere on the page (confirmed confusing, Neil).
      const shortLabel = (label) =>
        label
          .replace("NFL · Week ", "🏈 W")
          .replace("NCAA · Week ", "🎓 W")
          .replace("Preseason ", "Pre ")
          .replace("Postseason ", "Post ");
      document.getElementById("trend").innerHTML = graded_
        .map((r) => {
          const pct = Math.max(6, Math.round((r.points / maxPts) * 100));
          return `
            <div class="week-chart-bar" title="${r.label}: ${r.points} pts">
              <div class="week-chart-bar-value">${r.points}</div>
              <div class="week-chart-bar-track">
                <div class="week-chart-bar-fill" style="height:${pct}%"></div>
              </div>
              <div class="week-chart-bar-label">${shortLabel(r.label)}</div>
            </div>`;
        })
        .join("");

      document.getElementById("weeks-list").innerHTML = [...rows].reverse().map(renderHistoryEntry).join("");
    }

    await load();
    setInterval(load, 30000);
    // Mobile browsers/PWAs pause timers while backgrounded (locked screen,
    // app switched away from) — refresh immediately on return instead of
    // waiting for the next scheduled tick, which can be stale by minutes.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") load();
    });
  })();
</script>
</body>
</html>
